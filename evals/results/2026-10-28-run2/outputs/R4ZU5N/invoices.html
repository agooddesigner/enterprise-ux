<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --surface-2:#f0f2f5; --text:#1b2330; --muted:#566074; --border:#d5dae3; --border-strong:#aeb6c4;
  --primary:#1c5fd6; --primary-h:#164fb4; --on-primary:#fff;
  --danger:#b3261e; --danger-bg:#fdecea; --warn:#8a5200; --warn-bg:#fff3d9; --ok:#17683a; --ok-bg:#e4f4ea; --info-bg:#e8f0fd;
  --sel:#e8f0fd; --active:#cfe0fb; --focus:#0b57d0; --row-h:40px; --shadow:0 8px 28px rgba(15,25,45,.2);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a2029; --surface-2:#222a36; --text:#e8ecf3; --muted:#a2adc0; --border:#323c4b; --border-strong:#4b586c;
  --primary:#6ea0ff; --primary-h:#8fb5ff; --on-primary:#0a1a38;
  --danger:#ff8f86; --danger-bg:#3a1c1a; --warn:#f2b45a; --warn-bg:#3a2c12; --ok:#6fd49a; --ok-bg:#16301f; --info-bg:#1b2a47;
  --sel:#1b2a47; --active:#25407a; --focus:#8fb5ff; --shadow:0 8px 28px rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a2029; --surface-2:#222a36; --text:#e8ecf3; --muted:#a2adc0; --border:#323c4b; --border-strong:#4b586c;
  --primary:#6ea0ff; --primary-h:#8fb5ff; --on-primary:#0a1a38;
  --danger:#ff8f86; --danger-bg:#3a1c1a; --warn:#f2b45a; --warn-bg:#3a2c12; --ok:#6fd49a; --ok-bg:#16301f; --info-bg:#1b2a47;
  --sel:#1b2a47; --active:#25407a; --focus:#8fb5ff; --shadow:0 8px 28px rgba(0,0,0,.55);}
body.compact{--row-h:32px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--surface);padding:8px 12px;border:1px solid var(--border-strong);z-index:100}
.skip:focus{top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;min-width:32px;padding:4px 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.btn.primary:hover{background:var(--primary-h)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
:root[data-theme=dark] .btn.danger-solid,.btn.danger-solid{color:#fff}
.btn.sm{min-height:26px;padding:1px 8px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--primary);cursor:pointer;text-decoration:underline;font-weight:600}

/* header */
header.page{padding:16px 24px 0;background:var(--surface);border-bottom:1px solid var(--border)}
.title-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:22px;line-height:1.2}
.sub{color:var(--muted);margin:2px 0 0}
.tabs{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--text)}
.tab[aria-current=true]{color:var(--text);font-weight:600;border-bottom-color:var(--primary)}
.tab .n{font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:10px;padding:0 7px;margin-left:4px;font-size:12px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field input,.field select{height:32px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:0 8px;color:var(--text);font-size:14px}
.field.search input{width:280px}
.field.amt input{width:96px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 24px 0;min-height:0}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--info-bg);border-radius:14px;padding:2px 4px 2px 10px;font-size:13px}
.chip button{border:0;background:none;cursor:pointer;min-width:24px;min-height:24px;border-radius:12px;font-size:15px;line-height:1}
.chip button:hover{background:var(--active)}

/* summary / bulk bar */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 24px;min-height:50px}
.bar .summary{font-variant-numeric:tabular-nums}
.bar .grow{flex:1}
.bar.bulk{background:var(--sel);border-bottom:1px solid var(--active);position:sticky;top:0;z-index:5}
.strip{padding:6px 24px;background:var(--warn-bg);color:var(--text);font-size:13px;border-bottom:1px solid var(--border)}
.banner{margin:8px 24px;padding:10px 12px;border-radius:6px;background:var(--info-bg);display:flex;gap:10px;align-items:center}
.banner.error{background:var(--danger-bg)}

/* table */
main{flex:1;min-height:0;display:flex;flex-direction:column}
.tablewrap{flex:1;min-height:280px;overflow:auto;margin:0 24px;border:1px solid var(--border);border-radius:6px;background:var(--surface);position:relative}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1120px}
th,td{padding:0 10px;height:var(--row-h);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--surface-2);z-index:3;font-weight:600;font-size:13px;height:36px}
th button.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;min-height:24px}
th button.sort:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
th button.sort .arr{color:var(--muted);font-size:11px;width:10px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
th.num button.sort{flex-direction:row-reverse}
td.chk,th.chk{width:40px;padding:0 0 0 12px}
input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--primary)}
td.vendor{max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.act,th.act{position:sticky;right:0;background:var(--surface);z-index:2;box-shadow:-1px 0 0 var(--border);text-align:right}
thead th.act{background:var(--surface-2);z-index:4}
tbody tr{outline-offset:-2px}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.sel td{background:var(--sel)}
tbody tr.active td{background:var(--active)}
tbody tr:focus-visible{outline:2px solid var(--focus)}
.inv{all:unset;cursor:pointer;color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums;text-decoration:underline;text-underline-offset:2px}
.inv:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sec{color:var(--muted);font-size:12px;margin-left:6px}
.overdue{color:var(--danger);font-weight:600}
.soon{color:var(--warn);font-weight:600}
.badge{display:inline-flex;gap:5px;align-items:center;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600}
.badge.pending{background:var(--info-bg)}
.badge.approved{background:var(--ok-bg);color:var(--ok)}
.badge.rejected{background:var(--danger-bg);color:var(--danger)}
.badge.deleted{background:var(--surface-2);color:var(--muted)}
.flag{display:inline-block;font-size:12px;border:1px solid var(--warn);color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 6px;margin-right:4px}
.flag.quiet{border-color:var(--border-strong);color:var(--muted);background:transparent}
.dash{color:var(--muted)}
td.act .btn{margin-left:4px}
.skel td div{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--surface-2),var(--border),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel td div{animation:none}*{transition:none!important}}
.empty{padding:64px 24px;text-align:center;max-width:520px;margin:0 auto}
.empty h2{margin:0 0 6px;font-size:18px}
.empty p{color:var(--muted);margin:0 0 16px}
footer.pager{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 24px 8px}
.pager .grp{display:flex;gap:8px;align-items:center}
.devbar{padding:6px 24px 14px;font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.devbar select{height:26px}

/* menu */
.menu{position:fixed;z-index:60;min-width:200px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:var(--shadow);padding:4px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:4px;cursor:pointer;min-height:30px}
.menu button:hover,.menu button:focus{background:var(--surface-2)}
.menu .d{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}

/* toasts */
#toasts{position:fixed;top:12px;right:12px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 24px))}
.toast{background:var(--text);color:var(--bg);border-radius:6px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.toast .m{flex:1}
.toast button{background:none;border:0;color:inherit;cursor:pointer;text-decoration:underline;font-weight:600;min-height:24px;min-width:24px}
.toast button.x{text-decoration:none;font-size:16px}

/* dialog */
dialog{border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);padding:0;max-width:min(520px,calc(100vw - 24px));width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,25,.5)}
dialog form{padding:20px}
dialog h2{margin:0 0 10px;font-size:18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg-body label{display:block;margin:12px 0 2px;font-weight:600}
.dlg-body select,.dlg-body textarea{width:100%;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);padding:6px 8px}
.dlg-body textarea{min-height:70px;resize:vertical}
.dlg-body ul{margin:8px 0;padding-left:20px}
.err{color:var(--danger);margin:4px 0 0;font-weight:600}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:8px 0}

/* detail panel */
aside#panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--border-strong);box-shadow:var(--shadow);z-index:40;display:flex;flex-direction:column}
aside#panel[hidden]{display:none}
.p-head{display:flex;align-items:center;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border)}
.p-head h2{flex:1;margin:0;font-size:16px}
.p-body{flex:1;overflow:auto;padding:16px}
.p-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0 0 16px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.lines{width:100%;min-width:0;font-size:13px}
.lines th,.lines td{height:30px;white-space:normal}
.lines thead th{position:static}
@media (max-width:760px){.filters,.bar,footer.pager,.devbar,header.page{padding-left:12px;padding-right:12px}.tablewrap{margin:0 12px}.field.search input{width:100%}.field.search{flex:1 1 100%}.banner{margin:8px 12px}}
</style>
</head>
<body>
<a class="skip" href="#tbl">Skip to invoice table</a>
<div id="toasts" role="region" aria-label="Notifications"></div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>

<header class="page">
  <div class="title-row">
    <div>
      <h1>Invoices</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btnHelp" type="button" aria-haspopup="dialog">Shortcuts <kbd>?</kbd></button>
      <button class="btn" id="btnDensity" type="button" aria-pressed="false">Compact rows</button>
      <button class="btn" id="btnExport" type="button">Export CSV</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Invoice status"></nav>
</header>

<section class="filters" aria-label="Filter invoices" id="filters">
  <div class="field search"><label for="fq">Search</label><input id="fq" type="search" placeholder="Invoice no., vendor, PO or vendor ref" autocomplete="off"></div>
  <div class="field"><label for="fvendor">Vendor</label><select id="fvendor"></select></div>
  <div class="field"><label for="fdue">Due date</label><select id="fdue"><option value="">Any</option><option value="overdue">Overdue</option><option value="week">Due in next 7 days</option></select></div>
  <div class="field"><label for="fflag">Flags</label><select id="fflag"><option value="">Any</option><option value="duplicate">Possible duplicate</option><option value="nopo">No PO</option></select></div>
  <div class="field amt"><label for="fmin">Min amount ($)</label><input id="fmin" inputmode="decimal" autocomplete="off"></div>
  <div class="field amt"><label for="fmax">Max amount ($)</label><input id="fmax" inputmode="decimal" autocomplete="off"></div>
</section>
<div class="chips" id="chips" aria-label="Active filters"></div>

<main>
  <div id="viewer"></div>
  <div id="bar"></div>
  <div id="strip"></div>
  <div id="errbanner"></div>
  <div class="tablewrap" id="wrap"><table id="tbl" aria-describedby="sub"><caption class="sr-only" id="cap">Invoices</caption><thead></thead><tbody></tbody></table><div id="emptyzone"></div></div>
  <footer class="pager" id="pager"></footer>
  <div class="devbar">
    <label for="dstate">Preview state (for design review):</label>
    <select id="dstate"><option value="normal">Normal</option><option value="loading">Loading</option><option value="error">Load error</option><option value="empty">First use (no invoices)</option><option value="viewer">View-only role</option></select>
    <button class="link" id="btnReset" type="button">Reset demo data</button>
  </div>
</main>

<aside id="panel" hidden aria-labelledby="pTitle"></aside>
<dialog id="dlg" aria-labelledby="dlgT"></dialog>
<div id="menuHost"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const dateF = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric" });
const dateTimeF = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? "" : "s"}`;
const NOW = new Date();
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const DAY = 864e5;
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { localStorage.setItem(k, v) } catch {} } };

/* ---------- realistic seed data ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
const VENDORS = ["Acme Industrial Supply", "Northwind Logistics", "Müller & Söhne GmbH", "株式会社東和商事", "Globex Cloud Services", "Initech Software Licensing", "Brightline Office Furniture", "Harbor & Pine Catering", "Kowalski Consulting Sp. z o.o.", "Stellar Freight International Forwarding and Customs Brokerage Ltd.", "Vandelay Import/Export", "Pied Piper Hosting", "Hooli Telecom", "Soylent Packaging", "Umbrella Facilities Management", "Wayne Security Systems", "Cyberdyne Hardware", "Aperture Lab Supplies", "Wonka Confectionery Wholesale", "Oscorp Chemicals", "Dunder Mifflin Paper", "Massive Dynamic Research", "Tyrell Staffing", "Gringotts Insurance Brokers", "Bluth Property Services", "Prestige Worldwide Events", "Sterling & Cooper Advertising", "Los Pollos Fresh Foods S.A. de C.V."];
const LINES = ["Monthly service fee", "Professional services (hours)", "Hardware – replacement parts", "Freight and handling", "Annual license renewal", "Consumables and supplies", "On-site maintenance visit", "Catering – quarterly offsite", "Cloud usage (overage)", "Customs duties and fees"];
const REASONS = ["Duplicate invoice", "Amount doesn't match PO", "No approved PO or budget", "Wrong billing entity or details", "Other (explain in note)"];
const SUBMITTERS = ["Priya Raman", "Tomás Ortega", "Hannah Becker", "Wei Zhang", "Sam O'Connell", "Amara Nwosu"];

function seedData() {
  const r = rng(20261028), out = [];
  const N = 214;
  for (let i = 0; i < N; i++) {
    const vendor = VENDORS[Math.floor(r() * VENDORS.length)];
    let amount = Math.round(Math.exp(Math.log(85) + r() * (Math.log(48000) - Math.log(85))) * 100) / 100;
    if (i % 53 === 17) amount = -Math.round(amount / 8 * 100) / 100; // credit note
    const terms = [15, 30, 30, 45, 60][Math.floor(r() * 5)];
    const subDay = new Date(TODAY.getTime() - Math.floor(Math.pow(r(), 1.6) * 30) * DAY);
    const submitted = new Date(subDay.getTime() + (7 + Math.floor(r() * 11)) * 36e5 + Math.floor(r() * 60) * 6e4);
    const roll = r();
    const status = roll < .72 ? "pending" : roll < .91 ? "approved" : "rejected";
    const nLines = 1 + Math.floor(r() * 3); let left = amount; const lines = [];
    for (let l = 0; l < nLines; l++) { const a = l === nLines - 1 ? left : Math.round(left * (.3 + r() * .4) * 100) / 100; left = Math.round((left - a) * 100) / 100; lines.push({ desc: LINES[Math.floor(r() * LINES.length)], amount: a }); }
    out.push({
      id: "INV-2026-" + String(4400 - i).padStart(4, "0"), vendor, amount, submitted, due: new Date(new Date(submitted.getFullYear(), submitted.getMonth(), submitted.getDate()).getTime() + terms * DAY),
      terms, po: r() < .8 ? "PO-" + (410000 + Math.floor(r() * 9000)) : null, vendorRef: String.fromCharCode(65 + Math.floor(r() * 26)) + "-" + (10000 + Math.floor(r() * 89999)),
      status, reason: null, note: "", submitter: SUBMITTERS[Math.floor(r() * SUBMITTERS.length)], lines, dupOf: null
    });
    if (status === "rejected") { out[i].reason = REASONS[Math.floor(r() * 4)]; }
  }
  // plant duplicates: later-submitted copy of an earlier pending invoice
  out.filter(x => x.status === "pending").slice(8, 52).filter((_, k) => k % 7 === 0).forEach((orig, k) => {
    const src = out.indexOf(orig); const j = Math.max(0, src - 6 - k);
    if (out[j].status !== "pending") return;
    Object.assign(out[j], { vendor: orig.vendor, amount: orig.amount, vendorRef: orig.vendorRef, lines: orig.lines.map(l => ({ ...l })), dupOf: orig.id, terms: orig.terms });
    out[j].due = new Date(new Date(out[j].submitted.getFullYear(), out[j].submitted.getMonth(), out[j].submitted.getDate()).getTime() + orig.terms * DAY);
  });
  return out;
}
let DATA = seedData();
const byId = id => DATA.find(x => x.id === id);

/* ---------- state (mirrored in URL) ---------- */
const DEFAULTS = { status: "pending", q: "", vendor: "", due: "", flag: "", min: "", max: "", sort: "due", dir: "asc", page: 1, size: 50, open: "" };
const S = { ...DEFAULTS };
const U = { mode: "normal", sel: new Set(), active: null, lastClick: -1, history: [], shortcuts: store.get("inv.shortcuts") !== "off", focusIdx: null, loading: true };
(function readURL() { const p = new URLSearchParams(location.search); for (const k in DEFAULTS) if (p.has(k)) S[k] = (k === "page" || k === "size") ? (+p.get(k) || DEFAULTS[k]) : p.get(k); })();
function writeURL() { const p = new URLSearchParams(); for (const k in DEFAULTS) if (S[k] !== DEFAULTS[k]) p.set(k, S[k]); try { history.replaceState(null, "", p.toString() ? "?" + p : location.pathname) } catch {} }
if (store.get("inv.compact") === "1") document.body.classList.add("compact");

/* ---------- derived data ---------- */
const flagsOf = x => ({ dup: !!x.dupOf, nopo: !x.po });
function matches(x, skipStatus) {
  if (!skipStatus) { if (S.status === "all") { if (x.status === "deleted") return false } else if (x.status !== S.status) return false }
  if (S.q) { const q = S.q.toLowerCase(); if (!(x.id + " " + x.vendor + " " + (x.po || "") + " " + x.vendorRef).toLowerCase().includes(q)) return false }
  if (S.vendor && x.vendor !== S.vendor) return false;
  if (S.due === "overdue" && !(x.status === "pending" && x.due < TODAY)) return false;
  if (S.due === "week" && !(x.status === "pending" && x.due >= TODAY && x.due < new Date(TODAY.getTime() + 8 * DAY))) return false;
  if (S.flag === "duplicate" && !x.dupOf) return false;
  if (S.flag === "nopo" && x.po) return false;

/* ---------- dialog ---------- */

/* ---------- actions ---------- */

const sum = items => money.format(total(items));

async function doApprove(ids) {

}

  p.hidden = false;
  const editable = canEdit();
  p.innerHTML = `<div class="p-head"><h2 id="pTitle">${esc(x.id)}</h2><button class="btn ghost" id="pPrev" type="button" aria-label="Previous invoice" ${i <= 0 ? 'aria-disabled="true"' : ""}>↑</button><button class="btn ghost" id="pNext" type="button" aria-label="Next invoice" ${i < 0 || i >= list.length - 1 ? 'aria-disabled="true"' : ""}>↓</button><button class="btn ghost" id="pClose" type="button" aria-label="Close details">✕</button></div>
  <div class="p-body"><p style="margin-top:0">${badge(x.status)} ${flagsCell(x)}</p>
  ${x.dupOf ? `<div class="banner" style="margin:0 0 12px"><span>Same vendor and amount as <strong>${esc(x.dupOf)}</strong>. Check that this isn't a re-send before approving.</span></div>` : ""}
  ${x.status === "rejected" ? `<div class="banner error" style="margin:0 0 12px"><span><strong>Rejected:</strong> ${esc(x.reason)}${x.note ? ` — ${esc(x.note)}` : ""}</span></div>` : ""}
  <dl class="kv"><dt>Vendor</dt><dd>${esc(x.vendor)}</dd><dt>Amount</dt><dd style="font-variant-numeric:tabular-nums"><strong>${money.format(x.amount)}</strong>${x.amount < 0 ? " (credit note)" : ""}</dd><dt>Due date</dt><dd>${dueCell(x)} · Net ${x.terms}</dd><dt>Purchase order</dt><dd>${x.po ? esc(x.po) : '<span class="dash">— none on invoice</span>'}</dd><dt>Vendor reference</dt><dd>${esc(x.vendorRef)}</dd><dt>Submitted</dt><dd>${dateTimeF.format(x.submitted)}<br><span class="sec" style="margin:0">by ${esc(x.submitter)}</span></dd></dl>
  <table class="lines" style="min-width:0"><caption style="text-align:left;font-weight:600;padding-bottom:4px">Line items</caption><thead><tr><th scope="col">Description</th><th scope="col" class="num">Amount</th></tr></thead><tbody>${x.lines.map(l => `<tr><td>${esc(l.desc)}</td><td class="num">${money.format(l.amount)}</td></tr>`).join("")}<tr><th scope="row">Total</th><td class="num"><strong>${money.format(x.amount)}</strong></td></tr></tbody></table></div>
  <div class="p-foot">${!editable ? `<span class="sub">View-only access.</span>` : x.status === "pending" ? `<button class="btn primary" id="pApprove" type="button">Approve</button><button class="btn" id="pReject" type="button">Reject…</button><span style="flex:1"></span><button class="btn danger" id="pDelete" type="button">Delete</button>` : x.status === "deleted" ? `<button class="btn primary" id="pRestore" type="button">Restore</button>` : `<button class="btn" id="pReopen" type="button">Return to pending</button><span style="flex:1"></span><button class="btn danger" id="pDelete" type="button">Delete</button>`}</div>`;
  if (keepFocus && $("#" + keepFocus)) $("#" + keepFocus).focus();
}

/* ---------- row menu ---------- */
let menuOpener = null;
function openMenu(btn, id) {
  closeMenu(); menuOpener = btn; const x = byId(id), r = btn.getBoundingClientRect();
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu"); m.setAttribute("aria-label", `Actions for ${x.id}`);
  m.innerHTML = `<button role="menuitem" data-m="open">Open details</button><button role="menuitem" data-m="copy">Copy invoice number</button>` + (x.status !== "pending" && x.status !== "deleted" ? `<button role="menuitem" data-m="reopen">Return to pending</button>` : "") + `<hr><button role="menuitem" class="d" data-m="delete">Delete…</button>`;
  $("#menuHost").appendChild(m);
  const mh = m.offsetHeight; m.style.top = Math.min(r.bottom + 2, innerHeight - mh - 8) + "px"; m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + "px";
  const items = $$("button", m); items[0].focus();
  m.onkeydown = e => { const i = items.indexOf(document.activeElement); if (e.key === "ArrowDown") { items[(i + 1) % items.length].focus(); e.preventDefault() } else if (e.key === "ArrowUp") { items[(i - 1 + items.length) % items.length].focus(); e.preventDefault() } else if (e.key === "Escape") { closeMenu(true); e.stopPropagation() } else if (e.key === "Tab") { closeMenu(false) } };
  m.onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; const k = b.dataset.m; closeMenu(k === "open" || k === "copy"); if (k === "open") openPanel(id, btn); if (k === "copy") { navigator.clipboard?.writeText(id).catch(() => {}); toast(`Copied ${esc(id)}.`); } if (k === "reopen") doReopen(id); if (k === "delete") doDelete([id]); };
}
function closeMenu(refocus) { const m = $(".menu"); if (m) { m.remove(); if (refocus && menuOpener && document.contains(menuOpener)) menuOpener.focus(); } }
document.addEventListener("mousedown", e => { if (!e.target.closest(".menu") && !e.target.closest('[data-act="menu"]')) closeMenu(); });

/* ---------- events ---------- */
const rowId = el => el.closest("tr[data-id]")?.dataset.id;
const targets = () => U.sel.size ? [...U.sel] : (U.active ? [U.active] : []);
$("#tbl").addEventListener("click", e => {
  const sortB = e.target.closest("[data-sort]");
  if (sortB) { const k = sortB.dataset.sort; if (S.sort === k) S.dir = S.dir === "asc" ? "desc" : "asc"; else { S.sort = k; S.dir = k === "amount" || k === "submitted" ? "desc" : "asc"; } S.page = 1; render(); $(`[data-sort="${k}"]`)?.focus(); return; }
  if (e.target.id === "chkAll") { const rows = pageRows(filtered()); rows.forEach(r => e.target.checked ? U.sel.add(r.id) : U.sel.delete(r.id)); render(); $("#chkAll")?.focus(); return; }
  const id = rowId(e.target); if (!id) return;
  if (e.target.matches("[data-sel]")) {
    const rows = pageRows(filtered()), i = rows.findIndex(r => r.id === id);
    if (e.shiftKey && U.lastClick >= 0) { const [a, b] = [Math.min(i, U.lastClick), Math.max(i, U.lastClick)]; rows.slice(a, b + 1).forEach(r => e.target.checked ? U.sel.add(r.id) : U.sel.delete(r.id)); }
    else e.target.checked ? U.sel.add(id) : U.sel.delete(id);
    U.lastClick = i; U.active = id; render(); $(`tr[data-id="${CSS.escape(id)}"] [data-sel]`)?.focus(); return;
  }
  const a = e.target.closest("[data-act]")?.dataset.act; U.active = id;
  if (a === "approve") { U.sel.delete(id); doApprove([id]); }
  else if (a === "reject") doReject([id]);
  else if (a === "restore") doRestore([id]);
  else if (a === "open") openPanel(id, e.target);
  else if (a === "menu") openMenu(e.target.closest("button"), id);
});
$("#tbl").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("tr[data-id]")) openPanel(e.target.dataset.id, e.target); });
$("#tabs").addEventListener("click", e => { const t = e.target.closest("[data-tab]"); if (t) setStatus(t.dataset.tab); });
function setStatus(k) { S.status = k; S.page = 1; U.sel.clear(); render(); }
document.addEventListener("click", e => {
  const c = e.target.closest("[data-clear]"); if (c) { const k = c.dataset.clear; if (k === "all") ["q", "vendor", "due", "flag", "min", "max"].forEach(f => S[f] = ""); else S[k] = ""; S.page = 1; U.sel.clear(); syncInputs(); render(); return; }
  const t = e.target.closest("[data-tab]"); if (t && !e.target.closest("#tabs")) setStatus(t.dataset.tab);
  const b = e.target.closest("[data-bulk]"); if (b) {
    const k = b.dataset.bulk, ids = [...U.sel];
    if (k === "clear") { U.sel.clear(); render(); } else if (k === "selectall") { filtered().forEach(x => U.sel.add(x.id)); render(); }
    else if (k === "approve") doApprove(ids); else if (k === "reject") doReject(ids); else if (k === "delete") doDelete(ids); else if (k === "restore") doRestore(ids);
  }
  switch (e.target.id) {
    case "btnRetry": U.mode = "normal"; $("#dstate").value = "normal"; U.loading = true; render(); setTimeout(() => { U.loading = false; render(); }, 500); break;
    case "prev": if (S.page > 1) { S.page--; U.sel.clear(); render(); } break;
    case "next": if (S.page < Math.ceil(filtered().length / S.size)) { S.page++; U.sel.clear(); render(); } break;
    case "pClose": closePanel(); break;
    case "pPrev": case "pNext": { const list = filtered(), i = list.findIndex(x => x.id === S.open), n = list[i + (e.target.id === "pNext" ? 1 : -1)]; if (n) { S.open = n.id; U.active = n.id; const rows = pageRows(list); const idx = list.indexOf(n); S.page = Math.floor(idx / S.size) + 1; render(); $(`tr[data-id="${CSS.escape(n.id)}"]`)?.scrollIntoView({ block: "nearest" }); } break; }
    case "pApprove": doApprove([S.open]); break; case "pReject": doReject([S.open]); break; case "pDelete": doDelete([S.open]); break;
    case "pRestore": doRestore([S.open]); break; case "pReopen": doReopen(S.open); break;
    case "btnCopyAddr": navigator.clipboard?.writeText("invoices@ap.example.com").catch(() => {}); toast("Copied invoices@ap.example.com."); break;
  }
});
document.addEventListener("change", e => {
  if (e.target.id === "psize") { S.size = +e.target.value; S.page = 1; U.sel.clear(); render(); $("#psize").focus(); }
});
function bindFilter(id, key, ev) { $(id).addEventListener(ev, () => { S[key] = $(id).value.trim(); S.page = 1; U.sel.clear(); render(); }); }
let qT; $("#fq").addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { S.q = $("#fq").value.trim(); S.page = 1; U.sel.clear(); render(); }, 120); });
bindFilter("#fvendor", "vendor", "change"); bindFilter("#fdue", "due", "change"); bindFilter("#fflag", "flag", "change");
["#fmin:min", "#fmax:max"].forEach(s => { const [id, k] = s.split(":"); $(id).addEventListener("input", () => { clearTimeout(qT); qT = setTimeout(() => { S[k] = $(id).value.replace(/[^0-9.\-]/g, ""); S.page = 1; U.sel.clear(); render(); }, 250); }); });
function syncInputs() { $("#fq").value = S.q; $("#fvendor").value = S.vendor; $("#fdue").value = S.due; $("#fflag").value = S.flag; $("#fmin").value = S.min; $("#fmax").value = S.max; }
$("#fvendor").innerHTML = `<option value="">All vendors</option>` + [...VENDORS].sort((a, b) => a.localeCompare(b)).map(v => `<option>${esc(v)}</option>`).join("");

$("#btnDensity").addEventListener("click", e => { const c = document.body.classList.toggle("compact"); e.currentTarget.setAttribute("aria-pressed", c); e.currentTarget.textContent = c ? "Comfortable rows" : "Compact rows"; store.set("inv.compact", c ? "1" : "0"); });
if (document.body.classList.contains("compact")) { $("#btnDensity").setAttribute("aria-pressed", "true"); $("#btnDensity").textContent = "Comfortable rows"; }
$("#btnExport").addEventListener("click", () => {
  const sel = [...U.sel].map(byId).filter(Boolean), list = sel.length ? sel : filtered();
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const csv = ["Invoice,Vendor,Amount USD,Due date,Status,PO,Vendor ref,Submitted (ISO)"].concat(list.map(x => [x.id, x.vendor, x.amount.toFixed(2), x.due.toISOString().slice(0, 10), x.status, x.po || "", x.vendorRef, x.submitted.toISOString()].map(q).join(","))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `invoices-${TODAY.toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`Exported ${plural(list.length, "invoice")}${sel.length ? " (selected)" : " (current filters)"}.`);
});
$("#dstate").addEventListener("change", e => { U.mode = e.target.value; U.sel.clear(); S.open = ""; render(); });
$("#btnReset").addEventListener("click", () => { DATA = seedData(); U.history = []; U.sel.clear(); Object.assign(S, DEFAULTS); syncInputs(); toast("Demo data reset."); render(); });

/* ---------- keyboard ---------- */
function help() {
  ask({
    title: "Keyboard shortcuts", focus: "#kbToggle",
    body: `<div class="keys"><span><kbd>j</kbd> <kbd>k</kbd></span><span>Next / previous invoice</span><span><kbd>x</kbd></span><span>Select or deselect invoice</span><span><kbd>Shift</kbd>+click</span><span>Select a range of invoices</span><span><kbd>a</kbd></span><span>Approve selected, or the highlighted invoice</span><span><kbd>r</kbd></span><span>Reject (asks for a reason)</span><span><kbd>#</kbd></span><span>Delete (single pending invoice can be undone)</span><span><kbd>Enter</kbd></span><span>Open details</span><span><kbd>/</kbd></span><span>Search</span><span><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Z</kbd></span><span>Undo last action</span><span><kbd>Esc</kbd></span><span>Close panel, then clear selection</span></div>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="kbToggle" ${U.shortcuts ? "checked" : ""}> Single-key shortcuts on</label>`,
    actions: [{ label: "Close", value: "x", kind: "primary" }]
  }).then(() => { U.shortcuts = $("#kbToggle") ? $("#kbToggle").checked : U.shortcuts; });
  $("#kbToggle").addEventListener("change", e => { U.shortcuts = e.target.checked; store.set("inv.shortcuts", U.shortcuts ? "on" : "off"); });
}
$("#btnHelp").addEventListener("click", help);
document.addEventListener("keydown", e => {
  const tag = e.target.tagName, typing = /INPUT|TEXTAREA|SELECT/.test(tag) && !(tag === "INPUT" && e.target.type === "checkbox");
  if ($("#dlg").open) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) { e.preventDefault(); undo(); return; }
  if (e.key === "Escape") { if ($(".menu")) return; if (S.open) { closePanel(); } else if (U.sel.size) { U.sel.clear(); render(); } return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "?") { help(); e.preventDefault(); return; }
  if (!U.shortcuts || e.target.closest(".menu") || (e.target.matches("button,a") && !e.target.closest("tr"))) return;
  const rows = pageRows(filtered()); let i = rows.findIndex(r => r.id === U.active);
  const go = j => { if (!rows.length) return; j = Math.max(0, Math.min(rows.length - 1, j)); U.active = rows[j].id; $$("#tbl tbody tr").forEach(tr => { const on = tr.dataset.id === U.active; tr.classList.toggle("active", on); tr.tabIndex = on ? 0 : -1; if (on) { tr.focus(); } }); };
  switch (e.key) {
    case "j": go(i + 1); e.preventDefault(); break;
    case "k": go(i - 1); e.preventDefault(); break;
    case "x": if (canEdit() && U.active) { U.sel.has(U.active) ? U.sel.delete(U.active) : U.sel.add(U.active); U.focusIdx = i; render(); } break;
    case "a": if (canEdit() && targets().length) doApprove(targets()); break;
    case "r": if (canEdit() && targets().length) doReject(targets()); break;
    case "#": if (canEdit() && targets().length) doDelete(targets()); break;
    case "/": $("#fq").focus(); e.preventDefault(); break;
  }
});
window.addEventListener("beforeunload", () => {});

/* ---------- init ---------- */
syncInputs(); render();
setTimeout(() => { U.loading = false; render(); }, 500);
</script>
</body>
</html>
