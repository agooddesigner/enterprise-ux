<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay – Ticket queue</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --line-soft: #eceff3;
  --text: #1a1f29; --muted: #5d6676; --faint: #8a93a3;
  --accent: #3b5bdb; --accent-bg: #e8edff; --row-hover: #f3f5f9; --row-active: #e8edff;
  --danger: #c92a2a; --danger-bg: #fdecec; --warn: #a15c00; --warn-bg: #fff3d6;
  --ok: #2b7a3d; --ok-bg: #e3f4e7; --focus: #3b5bdb;
  --shadow: 0 8px 28px rgba(15,23,42,.18);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1b1f26; --line: #2c323c; --line-soft: #242932;
    --text: #e6e9ef; --muted: #a0a8b6; --faint: #7a8392;
    --accent: #8ea2ff; --accent-bg: #252d4d; --row-hover: #20252d; --row-active: #252d4d;
    --danger: #ff8787; --danger-bg: #3a2023; --warn: #ffc261; --warn-bg: #3a2f17;
    --ok: #7fd491; --ok-bg: #1d3324; --focus: #8ea2ff;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { display: grid; grid-template-columns: 220px minmax(0,1fr) 380px; height: 100vh; }

/* sidebar */
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { font-weight: 700; font-size: 16px; padding: 4px 10px 14px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); display: inline-block; }
.side h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 12px 10px 4px; font-weight: 600; }
.view { display: flex; justify-content: space-between; align-items: center; width: 100%; background: none; border: 0; text-align: left; padding: 7px 10px; border-radius: 6px; color: var(--muted); }
.view:hover { background: var(--row-hover); color: var(--text); }
.view[aria-current="true"] { background: var(--accent-bg); color: var(--text); font-weight: 600; }
.count { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--faint); }
.count.hot { color: var(--danger); font-weight: 700; }
.me { margin-top: auto; padding: 10px; display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 13px; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.top h1 { font-size: 16px; margin: 0 8px 0 0; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search input { width: 100%; padding: 7px 34px 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
select, .btn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.btn:hover, select:hover { background: var(--row-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #10131a; } }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
kbd { font: 11px ui-monospace, Menlo, monospace; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); background: var(--panel); }
.spacer { flex: 1; }

.bulk { display: none; padding: 8px 16px; background: var(--accent-bg); border-bottom: 1px solid var(--line); align-items: center; gap: 8px; }
.bulk.on { display: flex; flex-wrap: wrap; }

.listhead, .row { display: grid; grid-template-columns: 32px 92px minmax(0,1fr) 96px 40px 104px 64px; gap: 10px; align-items: center; padding: 0 16px; }
.listhead { height: 32px; font-size: 12px; color: var(--faint); background: var(--panel); border-bottom: 1px solid var(--line); text-transform: uppercase; letter-spacing: .04em; }
.list { flex: 1; overflow-y: auto; background: var(--panel); outline-offset: -2px; }
.row { min-height: 56px; padding-top: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line-soft); cursor: pointer; position: relative; }
.row:hover { background: var(--row-hover); }
.row[aria-selected="true"] { background: var(--row-active); }
.row.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.row.unread .subject { font-weight: 700; }
.subject { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12.5px; }
.id { color: var(--faint); font-variant-numeric: tabular-nums; margin-right: 6px; }
.row input[type=checkbox], .listhead input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }

.pri { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.pri svg { width: 14px; height: 14px; flex: none; }
.pri.urgent { color: var(--danger); font-weight: 600; }
.pri.high { color: var(--warn); font-weight: 600; }
.pri.normal, .pri.low { color: var(--muted); }
.tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
.tag.new { color: var(--accent); border-color: var(--accent); }
.tag.pending { color: var(--warn); border-color: var(--warn); }
.tag.resolved { color: var(--ok); border-color: var(--ok); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--line); color: var(--text); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.avatar.none { background: none; border: 1.5px dashed var(--faint); color: var(--faint); }
.avatar.me { background: var(--accent); color: #fff; }
@media (prefers-color-scheme: dark) { .avatar.me { color: #10131a; } }
.sla { font-variant-numeric: tabular-nums; font-size: 12.5px; padding: 2px 8px; border-radius: 6px; justify-self: start; white-space: nowrap; }
.sla.ok { color: var(--muted); }
.sla.risk { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.sla.breached { background: var(--danger-bg); color: var(--danger); font-weight: 700; }
.sla.paused { color: var(--faint); }
.age { color: var(--faint); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }

.empty { padding: 60px 24px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.foot { padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); display: flex; gap: 14px; flex-wrap: wrap; }

/* detail */
.pane { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.pane-head { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.pane-head h2 { margin: 4px 0 6px; font-size: 16px; line-height: 1.3; }
.pane-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
.fields { display: grid; grid-template-columns: 90px 1fr; gap: 8px 10px; align-items: center; margin-bottom: 16px; }
.fields label { color: var(--muted); font-size: 12.5px; }
.msg { border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg); }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.msg.agent { background: var(--accent-bg); }
.pane-actions { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.pane-close { display: none; float: right; }
.pane-empty { margin: auto; padding: 24px; text-align: center; color: var(--muted); }

/* toast + help */
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2430; color: #f1f3f8; padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); display: none; gap: 14px; align-items: center; z-index: 30; }
.toast.on { display: flex; }
.toast button { background: none; border: 0; color: #a9bbff; font-weight: 700; padding: 0; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); padding: 20px 24px; max-width: 420px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog h2 { margin: 0 0 12px; font-size: 16px; }
dialog dl { display: grid; grid-template-columns: 70px 1fr; gap: 8px 12px; margin: 0 0 16px; }
dialog dd { margin: 0; color: var(--muted); }

@media (max-width: 1180px) {
  .app { grid-template-columns: 190px minmax(0,1fr); }
  .pane { position: fixed; inset: 0 0 0 auto; width: min(420px, 100%); z-index: 20; box-shadow: var(--shadow); transform: translateX(100%); visibility: hidden; transition: transform .18s; }
  .pane.open { transform: none; visibility: visible; }
  .pane-close { display: inline-block; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }
  .side { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side h2, .brand, .me { display: none; }
  .view { width: auto; white-space: nowrap; gap: 8px; }
  .listhead { display: none; }
  .row { grid-template-columns: 28px minmax(0,1fr) auto; row-gap: 2px; }
  .row .c-pri, .row .c-status, .row .c-age { display: none; }
  .row .c-who { display: none; }
  kbd, .foot .kbdhint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .pane { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Queues">
    <div class="brand"><i aria-hidden="true"></i> Relay</div>
    <h2>Queues</h2>
    <div id="views"></div>
    <div class="me"><span class="avatar me" aria-hidden="true">PN</span> Priya Nair · Online</div>
  </nav>

  <main class="main">
    <div class="top">
      <h1 id="title">My tickets</h1>
      <div class="search">
        <label class="sr" for="q">Search tickets</label>
        <input id="q" type="search" placeholder="Search subject, requester, ID" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <label class="sr" for="fpri">Priority</label>
      <select id="fpri">
        <option value="">All priorities</option>
        <option value="urgent">Urgent</option><option value="high">High</option>
        <option value="normal">Normal</option><option value="low">Low</option>
      </select>
      <label class="sr" for="sort">Sort by</label>
      <select id="sort">
        <option value="sla">Sort: SLA due soonest</option>
        <option value="pri">Sort: Priority</option>
        <option value="new">Sort: Newest activity</option>
        <option value="old">Sort: Oldest waiting</option>
      </select>
      <span class="spacer"></span>
      <button class="btn" id="helpBtn" aria-label="Keyboard shortcuts">Shortcuts <kbd>?</kbd></button>
    </div>

    <div class="bulk" id="bulk" role="region" aria-label="Bulk actions">
      <strong id="bulkN"></strong>
      <button class="btn" data-bulk="assign">Assign to me <kbd>a</kbd></button>
      <button class="btn" data-bulk="resolve">Resolve <kbd>e</kbd></button>
      <label class="sr" for="bulkPri">Set priority</label>
      <select id="bulkPri"><option value="">Set priority…</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select>
      <button class="btn" data-bulk="clear">Clear <kbd>Esc</kbd></button>
    </div>

    <div class="listhead" aria-hidden="false">
      <input type="checkbox" id="all" aria-label="Select all tickets in this list">
      <span>Priority</span><span>Ticket</span><span>Status</span><span>Agent</span><span>SLA</span><span style="text-align:right">Updated</span>
    </div>
    <div class="list" id="list" role="listbox" aria-multiselectable="true" aria-label="Tickets" tabindex="0"></div>
    <div class="foot"><span id="shown"></span><span class="kbdhint"><kbd>j</kbd> <kbd>k</kbd> move · <kbd>x</kbd> select · <kbd>a</kbd> assign to me · <kbd>e</kbd> resolve</span><span id="clock" style="margin-left:auto"></span></div>
  </main>

  <aside class="pane" id="pane" aria-label="Ticket details"></aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo">Undo</button></div>

<dialog id="help">
  <h2>Keyboard shortcuts</h2>
  <dl>
    <dt><kbd>j</kbd> / <kbd>k</kbd></dt><dd>Next / previous ticket</dd>
    <dt><kbd>x</kbd></dt><dd>Select ticket</dd>
    <dt><kbd>a</kbd></dt><dd>Assign to me</dd>
    <dt><kbd>e</kbd></dt><dd>Resolve</dd>
    <dt><kbd>/</kbd></dt><dd>Search</dd>
    <dt><kbd>Esc</kbd></dt><dd>Clear selection / close</dd>
    <dt><kbd>g</kbd> <kbd>1–6</kbd></dt><dd>Jump to queue</dd>
  </dl>
  <form method="dialog"><button class="btn primary">Got it</button></form>
</dialog>

<script>
(() => {
  const ME = "priya";
  const AGENTS = { priya: "Priya Nair", tomas: "Tomás Reyes", june: "June Park", dev: "Dev Anand" };
  const PRI_RANK = { urgent: 0, high: 1, normal: 2, low: 3 };
  const MIN = 60000, NOW0 = Date.now();

  // ---- sample data (deterministic) ----
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const subjects = [
    ["Can't log in after password reset", "Reset link works but I land back on the login page."],
    ["Invoice shows wrong seat count", "We were billed for 40 seats; we have 32 active users."],
    ["Webhook deliveries failing with 502", "Started around 09:00 UTC; retries are piling up."],
    ["Export to CSV times out", "Large exports (50k+ rows) never finish."],
    ["SSO redirect loop with Okta", "Users bounce between Relay and Okta indefinitely."],
    ["Need to transfer workspace ownership", "Our admin left the company last week."],
    ["Mobile app crashes on attachment upload", "iOS 18.2, happens on any PDF over 5 MB."],
    ["Refund request for annual plan", "Switched vendors, within the 30-day window."],
    ["API rate limit too low for our integration", "We're hitting 429s during nightly sync."],
    ["Missing notification emails", "Assigned-ticket emails stopped arriving Tuesday."],
    ["How do I merge duplicate contacts?", "We have three records for the same customer."],
    ["Custom domain SSL certificate pending", "Status has been 'pending' for 3 days."],
    ["Data deletion request (GDPR)", "Please confirm deletion of all records for our user."],
    ["Dashboard numbers don't match export", "Closed count differs by about 12%."],
    ["Feature request: saved reply folders", "Our macro list is getting unwieldy."]
  ];
  const people = [["Alicia Romero","Brightwave"],["Ken Tanaka","Orbit Labs"],["Sara Lindqvist","Northfield"],["Marcus Bell","Kestrel Co"],["Ife Adeyemi","Lumen Health"],["Tom Whitaker","Pinegrove"],["Noor Hassan","Quill & Co"],["Luca Ferri","Mosaic"],["Hannah Cho","Stackhouse"],["Owen Price","Fieldnote"]];
  const tickets = [];
  for (let i = 0; i < 46; i++) {
    const [subject, snippet] = subjects[i % subjects.length];
    const [who, org] = pick(people);
    const roll = rnd();
    const status = roll < .18 ? "new" : roll < .66 ? "open" : roll < .88 ? "pending" : "resolved";
    const asg = status === "new" ? null : rnd() < .38 ? ME : rnd() < .25 ? null : pick(["tomas","june","dev"]);
    const pri = rnd() < .1 ? "urgent" : rnd() < .3 ? "high" : rnd() < .8 ? "normal" : "low";
    const slaMin = Math.round((rnd() * 7 - 1.3) * 60);       // some already breached
    tickets.push({
      id: 4821 - i * 3 - Math.floor(rnd() * 3), subject, snippet, who, org, status, pri, asg,
      due: NOW0 + slaMin * MIN,
      updated: NOW0 - Math.round(rnd() * 600) * MIN,
      created: NOW0 - Math.round(600 + rnd() * 3000) * MIN,
      unread: rnd() < .35
    });
  }
  // guarantee a few useful demo cases for "mine"
  tickets[1].asg = ME; tickets[1].status = "open"; tickets[1].pri = "urgent"; tickets[1].due = NOW0 - 22 * MIN;
  tickets[4].asg = ME; tickets[4].status = "open"; tickets[4].due = NOW0 + 38 * MIN;

  // ---- state ----
  const S = { view: "mine", q: "", pri: "", sort: "sla", sel: new Set(), activeId: null, rows: [] };
  try { const p = JSON.parse(localStorage.getItem("relay.q") || "{}"); if (p.view) S.view = p.view; if (p.sort) S.sort = p.sort; } catch (e) {}
  const save = () => { try { localStorage.setItem("relay.q", JSON.stringify({ view: S.view, sort: S.sort })); } catch (e) {} };

  const isOpen = t => t.status !== "resolved";
  const atRisk = t => isOpen(t) && t.status !== "pending" && t.due - Date.now() < 60 * MIN;
  const VIEWS = [
    { id: "mine",       name: "My tickets",        f: t => isOpen(t) && t.asg === ME },
    { id: "unassigned", name: "Unassigned",        f: t => isOpen(t) && !t.asg },
    { id: "risk",       name: "SLA at risk",       f: atRisk, hot: true },
    { id: "all",        name: "All open",          f: isOpen },
    { id: "pending",    name: "Waiting on customer", f: t => t.status === "pending" },
    { id: "resolved",   name: "Resolved",          f: t => t.status === "resolved" }
  ];
  const view = () => VIEWS.find(v => v.id === S.view) || VIEWS[0];

  // ---- helpers ----
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const initials = k => AGENTS[k].split(" ").map(w => w[0]).join("");
  const dur = ms => { const m = Math.max(0, Math.round(ms / MIN)); return m >= 1440 ? Math.floor(m / 1440) + "d" : m >= 60 ? Math.floor(m / 60) + "h " + (m % 60) + "m" : m + "m"; };
  const ago = ts => { const m = Math.round((Date.now() - ts) / MIN); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.floor(m / 60) + "h" : Math.floor(m / 1440) + "d"; };
  function sla(t) {
    if (t.status === "resolved") return { cls: "paused", txt: "Resolved" };
    if (t.status === "pending") return { cls: "paused", txt: "Paused" };
    const d = t.due - Date.now();
    if (d < 0) return { cls: "breached", txt: "⚠ Overdue " + dur(-d) };
    return { cls: d < 60 * MIN ? "risk" : "ok", txt: (d < 60 * MIN ? "⏱ " : "") + dur(d) };
  }
  const PRI_ICON = {
    urgent: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l6 11H1z" fill="currentColor"/></svg>',
    high: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2l5 6H2zM7 7l5 6H2z" fill="currentColor"/></svg>',
    normal: '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="6" width="10" height="2" fill="currentColor"/></svg>',
    low: '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12L1 6h12z" fill="currentColor"/></svg>'
  };
  const cap = s => s[0].toUpperCase() + s.slice(1);

  // ---- derive rows ----
  function compute() {
    const q = S.q.trim().toLowerCase();
    let rows = tickets.filter(view().f);
    if (S.pri) rows = rows.filter(t => t.pri === S.pri);
    if (q) rows = rows.filter(t => (t.subject + " " + t.who + " " + t.org + " #" + t.id).toLowerCase().includes(q));
    const cmp = {
      sla: (a, b) => (a.status === "pending") - (b.status === "pending") || a.due - b.due,
      pri: (a, b) => PRI_RANK[a.pri] - PRI_RANK[b.pri] || a.due - b.due,
      new: (a, b) => b.updated - a.updated,
      old: (a, b) => a.updated - b.updated
    }[S.sort];
    S.rows = rows.sort(cmp);
    for (const id of [...S.sel]) if (!S.rows.some(t => t.id === id)) S.sel.delete(id);
    if (!S.rows.some(t => t.id === S.activeId)) S.activeId = S.rows[0] ? S.rows[0].id : null;
  }

  // ---- render ----
  function renderViews() {
    $("#views").innerHTML = VIEWS.map((v, i) => {
      const n = tickets.filter(v.f).length;
      return `<button class="view" data-view="${v.id}" aria-current="${v.id === S.view}"><span>${v.name}</span><span class="count ${v.hot && n ? "hot" : ""}">${n}</span></button>`;
    }).join("");
  }
  function rowHTML(t) {
    const s = sla(t), sel = S.sel.has(t.id);
    const a = t.asg ? `<span class="avatar ${t.asg === ME ? "me" : ""}" title="${AGENTS[t.asg]}" aria-label="${AGENTS[t.asg]}">${initials(t.asg)}</span>`
                    : `<span class="avatar none" title="Unassigned" aria-label="Unassigned">?</span>`;
    return `<div class="row ${t.id === S.activeId ? "active" : ""} ${t.unread ? "unread" : ""}" id="r${t.id}" role="option" aria-selected="${sel}" data-id="${t.id}">
      <input type="checkbox" tabindex="-1" aria-label="Select ticket ${t.id}" ${sel ? "checked" : ""}>
      <span class="pri c-pri ${t.pri}">${PRI_ICON[t.pri]}${cap(t.pri)}</span>
      <div style="min-width:0"><div class="subject"><span class="id">#${t.id}</span>${esc(t.subject)}</div><div class="meta">${esc(t.who)} · ${esc(t.org)} — ${esc(t.snippet)}</div></div>
      <span class="c-status"><span class="tag ${t.status}">${t.status === "pending" ? "Waiting" : cap(t.status)}</span></span>
      <span class="c-who">${a}</span>
      <span class="sla ${s.cls}" data-sla="${t.id}">${s.txt}</span>
      <span class="age c-age">${ago(t.updated)}</span>
    </div>`;
  }
  function renderList() {
    const el = $("#list"), top = el.scrollTop;
    if (!S.rows.length) {
      const msg = S.q || S.pri ? ["No tickets match your filters", "Try clearing the search or priority filter."]
        : S.view === "mine" ? ["Your queue is clear", "Nothing assigned to you. Pick something up from Unassigned."]
        : ["Nothing here", "This queue is empty right now."];
      el.innerHTML = `<div class="empty"><strong>${msg[0]}</strong>${msg[1]}</div>`;
    } else el.innerHTML = S.rows.map(rowHTML).join("");
    el.scrollTop = top;
    el.setAttribute("aria-activedescendant", S.activeId ? "r" + S.activeId : "");
    $("#title").textContent = view().name;
    $("#shown").textContent = `${S.rows.length} ticket${S.rows.length === 1 ? "" : "s"}` + (S.sel.size ? ` · ${S.sel.size} selected` : "");
    const all = $("#all"); all.checked = S.rows.length > 0 && S.sel.size === S.rows.length; all.indeterminate = S.sel.size > 0 && S.sel.size < S.rows.length;
    $("#bulk").classList.toggle("on", S.sel.size > 0);
    $("#bulkN").textContent = S.sel.size + " selected";
  }
  function renderPane() {
    const p = $("#pane"), t = tickets.find(x => x.id === S.activeId);
    if (!t) { p.innerHTML = `<div class="pane-empty">Select a ticket to preview it.</div>`; return; }
    const s = sla(t);
    const opts = (obj, cur) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${k === cur ? "selected" : ""}>${v}</option>`).join("");
    p.innerHTML = `
      <div class="pane-head">
        <button class="btn pane-close" id="paneClose" aria-label="Close details">Close</button>
        <span class="id">#${t.id}</span><span class="tag ${t.status}">${t.status === "pending" ? "Waiting on customer" : cap(t.status)}</span>
        <h2>${esc(t.subject)}</h2>
        <div class="meta">${esc(t.who)} · ${esc(t.org)}</div>
      </div>
      <div class="pane-body">
        <div class="fields">
          <label for="fStatus">Status</label>
          <select id="fStatus">${opts({ new: "New", open: "Open", pending: "Waiting on customer", resolved: "Resolved" }, t.status)}</select>
          <label for="fPri">Priority</label>
          <select id="fPri">${opts({ urgent: "Urgent", high: "High", normal: "Normal", low: "Low" }, t.pri)}</select>
          <label for="fAsg">Assignee</label>
          <select id="fAsg"><option value="">Unassigned</option>${opts(AGENTS, t.asg)}</select>
          <label>SLA</label><span class="sla ${s.cls}" data-sla="${t.id}">${s.txt}</span>
          <label>Opened</label><span>${ago(t.created)} ago</span>
        </div>
        <div class="msg"><div class="who"><span>${esc(t.who)}</span><span>${ago(t.created)} ago</span></div>${esc(t.snippet)}</div>
        ${t.status !== "new" ? `<div class="msg agent"><div class="who"><span>${esc(AGENTS[t.asg || "tomas"])}</span><span>${ago(t.updated)} ago</span></div>Thanks for the details — looking into this now and will update you shortly.</div>` : ""}
      </div>
      <div class="pane-actions">
        ${t.asg !== ME ? `<button class="btn primary" data-act="assign">Assign to me <kbd>a</kbd></button>` : ""}
        ${t.status !== "resolved" ? `<button class="btn" data-act="resolve">Resolve <kbd>e</kbd></button>` : `<button class="btn" data-act="reopen">Reopen</button>`}
      </div>`;
  }
  function render() { compute(); renderViews(); renderList(); renderPane(); }

  // ---- mutations with undo ----
  let undoSnap = null, toastTimer;
  function toast(msg, snap) {
    undoSnap = snap; $("#toastMsg").textContent = msg; $("#toast").classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), 7000);
  }
  function targets() { return S.sel.size ? tickets.filter(t => S.sel.has(t.id)) : tickets.filter(t => t.id === S.activeId); }
  function mutate(label, fn, ts = targets()) {
    if (!ts.length) return;
    const snap = ts.map(t => ({ t, prev: { ...t } }));
    ts.forEach(t => { fn(t); t.updated = Date.now(); t.unread = false; });
    S.sel.clear();
    toast(`${label} · ${ts.length} ticket${ts.length > 1 ? "s" : ""}`, snap);
    render();
  }
  const A = {
    assign: ts => mutate("Assigned to you", t => { t.asg = ME; if (t.status === "new") t.status = "open"; }, ts),
    resolve: ts => mutate("Resolved", t => { t.status = "resolved"; }, ts),
    reopen: ts => mutate("Reopened", t => { t.status = "open"; }, ts)
  };
  $("#undo").onclick = () => {
    if (!undoSnap) return;
    undoSnap.forEach(({ t, prev }) => Object.assign(t, prev));
    undoSnap = null; $("#toast").classList.remove("on"); render();
  };

  // ---- navigation ----
  function move(d) {
    if (!S.rows.length) return;
    const i = S.rows.findIndex(t => t.id === S.activeId), n = Math.min(S.rows.length - 1, Math.max(0, i + d));
    setActive(S.rows[n].id, false);
  }
  function setActive(id, openPane) {
    S.activeId = id; renderList(); renderPane();
    const el = document.getElementById("r" + id); if (el) el.scrollIntoView({ block: "nearest" });
    if (openPane) $("#pane").classList.add("open");
  }
  function toggleSel(id) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); renderList(); }

  // ---- events ----
  $("#views").onclick = e => { const b = e.target.closest("[data-view]"); if (!b) return; S.view = b.dataset.view; S.sel.clear(); save(); render(); };
  $("#q").oninput = e => { S.q = e.target.value; render(); };
  $("#fpri").onchange = e => { S.pri = e.target.value; render(); };
  $("#sort").value = S.sort;
  $("#sort").onchange = e => { S.sort = e.target.value; save(); render(); };
  $("#all").onchange = e => { S.sel = e.target.checked ? new Set(S.rows.map(t => t.id)) : new Set(); renderList(); };
  $("#list").onclick = e => {
    const r = e.target.closest(".row"); if (!r) return;
    const id = +r.dataset.id;
    if (e.target.matches("input[type=checkbox]")) { S.activeId = id; toggleSel(id); return; }
    setActive(id, true);
  };
  $("#bulk").onclick = e => {
    const b = e.target.closest("[data-bulk]"); if (!b) return;
    const k = b.dataset.bulk; if (k === "clear") { S.sel.clear(); renderList(); } else A[k]();
  };
  $("#bulkPri").onchange = e => { const v = e.target.value; if (v) mutate("Priority set to " + v, t => { t.pri = v; }); e.target.value = ""; };
  $("#pane").onclick = e => {
    if (e.target.closest("#paneClose")) { $("#pane").classList.remove("open"); $("#list").focus(); return; }
    const b = e.target.closest("[data-act]"); if (b) A[b.dataset.act](tickets.filter(t => t.id === S.activeId));
  };
  $("#pane").onchange = e => {
    const t = tickets.find(x => x.id === S.activeId); if (!t) return;
    const v = e.target.value, one = [t];
    if (e.target.id === "fStatus") mutate("Status → " + v, x => { x.status = v; }, one);
    if (e.target.id === "fPri") mutate("Priority → " + v, x => { x.pri = v; }, one);
    if (e.target.id === "fAsg") mutate(v ? "Assigned to " + AGENTS[v] : "Unassigned", x => { x.asg = v || null; if (v && x.status === "new") x.status = "open"; }, one);
  };
  $("#helpBtn").onclick = () => $("#help").showModal();

  let gPending = false;
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    const typing = tag === "input" && e.target.type !== "checkbox" || tag === "textarea";
    if (e.key === "Escape") {
      if (typing) { e.target.blur(); return; }
      if ($("#pane").classList.contains("open")) { $("#pane").classList.remove("open"); return; }
      if (S.sel.size) { S.sel.clear(); renderList(); } return;
    }
    if (typing || tag === "select" || $("#help").open) return;
    const k = e.key;
    if (gPending) { gPending = false; const v = VIEWS[+k - 1]; if (v) { S.view = v.id; S.sel.clear(); save(); render(); e.preventDefault(); } return; }
    if (k === "j" || k === "ArrowDown") { move(1); e.preventDefault(); }
    else if (k === "k" || k === "ArrowUp") { move(-1); e.preventDefault(); }
    else if (k === "x") { if (S.activeId) toggleSel(S.activeId); }
    else if (k === "a") A.assign(targets());
    else if (k === "e") A.resolve(targets());
    else if (k === "Enter" && tag !== "button") { if (S.activeId) setActive(S.activeId, true); }
    else if (k === "/") { e.preventDefault(); $("#q").focus(); }
    else if (k === "?") { $("#help").showModal(); }
    else if (k === "g") { gPending = true; setTimeout(() => gPending = false, 1200); }
  });

  // live SLA clocks: update text in place, never reorder under the agent's cursor
  function tick() {
    document.querySelectorAll("[data-sla]").forEach(el => {
      const t = tickets.find(x => x.id === +el.dataset.sla); if (!t) return;
      const s = sla(t); el.className = "sla " + s.cls; el.textContent = s.txt;
    });
    renderViews();
    $("#clock").textContent = "Live · SLA clocks update every 30s · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  setInterval(tick, 30000);

  render(); tick();
  $("#list").focus();
})();
</script>
</body>
</html>
